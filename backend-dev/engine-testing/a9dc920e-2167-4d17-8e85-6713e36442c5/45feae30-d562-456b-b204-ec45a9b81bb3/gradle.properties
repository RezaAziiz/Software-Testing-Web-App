# ========================================
# Gradle Performance Optimization
# ========================================

# Aktifkan Daemon: JVM tetap hidup setelah build pertama,
# sehingga eksekusi ke-2 dst JAUH lebih cepat (~2-5x)
org.gradle.daemon=true

# Timeout daemon: 30 menit (cukup untuk sesi lab mahasiswa)
org.gradle.daemon.idletimeout=1800000

# Aktifkan Build Cache: Gradle menyimpan hasil kompilasi,
# jika source tidak berubah, tidak perlu re-compile
org.gradle.caching=true

# Alokasi memori JVM: cukup untuk project kecil
org.gradle.jvmargs=-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError

# Aktifkan parallel execution
org.gradle.parallel=true

# Aktifkan configuration cache (Gradle 7.5+): 
# cache hasil konfigurasi build script, skip parsing ulang
org.gradle.configuration-cache=true

# Konsol plain (tanpa warna/animasi) untuk subprocess
org.gradle.console=plain
