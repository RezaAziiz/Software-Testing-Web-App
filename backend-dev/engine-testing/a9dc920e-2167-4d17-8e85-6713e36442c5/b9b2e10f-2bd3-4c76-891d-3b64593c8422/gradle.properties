org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.console=plain

# Keep the daemon alive within a small Cloud Run container. The test task uses
# a separate JVM, so a 512 MB Gradle heap can make the daemon get OOM-killed.
org.gradle.jvmargs=-Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false
