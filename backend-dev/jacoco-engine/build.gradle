plugins {
    id 'java'
    id "jacoco"
}

group 'org.jacoco-engine'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

jacoco {
    toolVersion = "0.8.8"
}

// Aktifkan incremental compilation
tasks.withType(JavaCompile).configureEach {
    options.incremental = true
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'junit:junit:4.13.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    // Fork JVM sekali saja untuk semua test (default), bukan per-test-class.
    // Batasi heap karena Gradle daemon dan test worker hidup bersamaan di Cloud Run.
    forkEvery = 0
    minHeapSize = "32m"
    maxHeapSize = "128m"
    jvmArgs "-XX:+UseSerialGC"

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        csv.enabled true
        xml.enabled true
        html.enabled true
    }
}

check.dependsOn jacocoTestReport

// Temporary build analyzer for bottleneck profiling. Task actions are used
// instead of taskGraph listeners because listeners prevent configuration-cache reuse.
tasks.configureEach { task ->
    task.doFirst {
        task.ext.profileStartTime = System.nanoTime()
    }
    task.doLast {
        def elapsedMs = (System.nanoTime() - task.ext.profileStartTime) / 1_000_000
        println "[PROFILE] ${task.path} : ${String.format('%.3f', elapsedMs)} ms"
    }
}
